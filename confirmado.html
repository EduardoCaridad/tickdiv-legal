<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuenta confirmada · TickDiv</title>
<style>
  :root { --verde:#0e7250; --tinta:#1f2937; --suave:#6b7280; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--tinta); background:#f7f8fa; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .tarjeta {
    background:#fff; border-radius:16px; padding:40px 28px; max-width:420px; width:100%;
    text-align:center; box-shadow:0 2px 12px rgba(0,0,0,.08);
  }
  .circulo {
    width:72px; height:72px; border-radius:50%; background:var(--verde);
    display:flex; align-items:center; justify-content:center; margin:0 auto 20px;
  }
  .circulo svg { width:38px; height:38px; }
  h1 { font-size:22px; margin:0 0 10px; color:var(--verde); }
  p { font-size:15px; line-height:1.6; color:var(--tinta); margin:0 0 8px; }
  .suave { font-size:13px; color:var(--suave); margin-top:18px; }
  .marca { font-size:13px; color:var(--suave); margin-top:28px; letter-spacing:.5px; }
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="circulo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 13l4 4L19 7" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>¡Cuenta confirmada!</h1>
    <p>Tu correo ha quedado verificado correctamente.</p>
    <p>Ya puedes volver a la app <strong>TickDiv</strong> e iniciar sesión con tu cuenta.</p>
    <p class="suave">Puedes cerrar esta página.</p>
    <p class="marca">TickDiv</p>
  </div>
</body>
</html>
